<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sign In | INTERVIEW.AI</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

    <style>
        .auth-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px;
        }

        .auth-box {
            width: 100%;
            max-width: 430px;
            padding: 40px;
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 18px;
            background: rgba(16,23,39,0.95);
            box-shadow: 0 25px 70px rgba(0,0,0,0.35);
        }

        .auth-logo {
            text-align: center;
            font-size: 25px;
            font-weight: 800;
            margin-bottom: 30px;
        }

        .auth-logo span {
            color: #7c5cff;
        }

        .auth-box h1 {
            font-size: 28px;
            letter-spacing: -1px;
            margin-bottom: 10px;
        }

        .auth-box > p {
            color: #9ba7bd;
            font-size: 13px;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            color: #cbd4e5;
            font-size: 13px;
            margin-bottom: 8px;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 13px;
            border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.15);
            background: #0b1220;
            color: white;
            outline: none;
        }

        .form-group input:focus {
            border-color: #7c5cff;
        }

        .auth-button {
            width: 100%;
            border: none;
            cursor: pointer;
            color: white;
            background: linear-gradient(135deg, #7c5cff, #9a78ff);
            padding: 14px;
            border-radius: 8px;
            font-weight: 700;
            margin-top: 8px;
        }

        .auth-footer {
            text-align: center;
            color: #9ba7bd;
            font-size: 13px;
            margin-top: 25px;
        }

        .auth-footer a {
            color: #9a78ff;
            font-weight: 700;
        }

        .back-home {
            display: block;
            text-align: center;
            color: #8d99b0;
            font-size: 12px;
            margin-top: 22px;
        }
    </style>
</head>

<body>

    <div class="auth-page">

        <div class="auth-box">

            <div class="auth-logo">
                INTERVIEW<span>.AI</span>
            </div>

            <h1>Welcome back</h1>

            <p>Sign in to continue to your interview workspace.</p>

            <form action="/login" method="POST">

                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="you@example.com"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        required
                    >
                </div>

                <button type="submit" class="auth-button">
                    Sign In →
                </button>

            </form>

            <div class="auth-footer">
                Don't have an account?
                <a href="/register">Create account</a>
            </div>

            <a href="/" class="back-home">← Back to homepage</a>

        </div>

    </div>

</body>

</html>
